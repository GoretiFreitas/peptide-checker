name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm is the project's package manager; package-lock.json is the single
      # lockfile. Node 24 also strips TypeScript natively, which is what the
      # test runner relies on.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders: the app reads real values at runtime, but
          # VITE_ vars are inlined, so they must be defined for the bundle.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PROJECT_ID: example
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          VITE_PAYMENTS_CLIENT_TOKEN: pk_test_ci
